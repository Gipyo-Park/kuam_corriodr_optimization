version: 1
disable_existing_loggers: False

formatters:
  access:
    "()": uvicorn.logging.AccessFormatter
    format: '%(asctime)s - %(levelprefix)s %(client_addr)s - "%(request_line)s" %(status_code)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  access:
    class: logging.StreamHandler
    formatter: access
    stream: ext://sys.stdout

loggers:
  uvicorn.access:
    level: INFO
    handlers: [access]
    propagate: False
